name: Security Audit - cronicas-app

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  audit:
    name: Audit & Fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Audit and fix app
        id: audit
        uses: masneto/cronicas-actions/.github/actions/npm-security-audit@main
        with:
          working-directory: '.'
          package-label: App
          changelog-path: SECURITY_FIXES.md

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.audit.outputs.had-vulnerabilities == 'true' && steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'fix(security): npm audit fixes'
          title: 'Security: npm audit fixes (${{ github.run_id }})'
          body: 'Automatic npm security updates. See the workflow summary and SECURITY_FIXES.md for details.'
          branch: security/npm-audit-fixes
          delete-branch: true
          labels: |
            security
            dependencies
            automated
          reviewers: masneto
          
      - name: Merge Pull Request
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.pull-request-number }}/merge" \
            -d '{"commit_title":"fix(security): npm audit fixes","merge_method":"squash"}'