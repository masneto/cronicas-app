name: Security Audit - cronicas-app

on:
  schedule:
    # Roda todo dia às 2 da manhã
    - cron: '0 2 * * *'
  # Permite rodar manualmente
  workflow_dispatch:

jobs:
  audit:
    name: Audit & Fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Audit and report
        run: |
          echo "=== Audit Report for cronicas-app ===" >> $GITHUB_STEP_SUMMARY
          npm audit >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Fix vulnerabilities
        id: audit
        run: |
          npm audit fix --force || true
          if ! npm audit --audit-level=moderate > /dev/null 2>&1; then
            echo "had_vulns=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.audit.outputs.had_vulns == 'true' && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'fix(security): npm audit fixes'
          title: 'Security: npm audit automatic fixes'
          body: |
            ## Automatic Security Update

            This PR contains security fixes detected by `npm audit`.

            **What changed:**
            - Ran `npm audit fix --force` to resolve vulnerabilities
            - Updated package-lock.json with patched versions

            ⚠️ **Important:** 
            1. Review the changes before merging
            2. Run tests: `npm test`
            3. Check if any major version updates were applied

            ### Next Steps
            - [ ] Review changes
            - [ ] Run `npm test` locally
            - [ ] Test the application
            - [ ] Merge when ready

            **Auto-generated by Security Audit workflow**
          branch: security/npm-audit-fixes
          delete-branch: true
          labels: |
            security
            dependencies
            automated
          reviewers: |
            masneto
